spring:
  application:
    name: carepoint
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/carepoint}
    username: ${DB_USER:carepoint}
    password: ${DB_PASSWORD:carepoint_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
    ignore-migration-patterns: repeatable:missing
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


server:
  port: 8080
  shutdown: graceful

carepoint:
  auth:
    jwt-issuer: carepoint
    # dev-only default — real deployments must set JWT_SIGNING_KEY (32+ random chars)
    jwt-signing-key: ${JWT_SIGNING_KEY:dev-only-insecure-key-change-me-32chars}
    access-token-ttl: 5m
    # sliding: every refresh re-arms it. = frontend idle limit (15m) + 1m keep-alive margin
    session-idle-timeout: ${SESSION_IDLE_TIMEOUT:16m}
    access-cookie: cp_access
    refresh-cookie: cp_refresh
    # must be true in any https deployment; false only for local http dev
    cookie-secure: ${COOKIE_SECURE:false}
  rate-limit:
    login-per-minute: ${RATE_LIMIT_LOGIN_PER_MIN:5}
    register-per-minute: ${RATE_LIMIT_REGISTER_PER_MIN:5}
    otp-per-minute: ${RATE_LIMIT_OTP_PER_MIN:10}
    availability-per-minute: ${RATE_LIMIT_AVAILABILITY_PER_MIN:60}
    booking-per-minute: ${RATE_LIMIT_BOOKING_PER_MIN:10}
    media-upload-per-minute: ${RATE_LIMIT_MEDIA_UPLOAD_PER_MIN:20}
  otp:
    ttl: ${OTP_TTL:2m}
    max-attempts: ${OTP_MAX_ATTEMPTS:4}
    max-sends: ${OTP_MAX_SENDS:4}
    resend-cooldown: ${OTP_RESEND_COOLDOWN:104s}
  mail:
    provider: ${MAIL_PROVIDER:log}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  app-base-url: ${APP_BASE_URL:http://localhost:8080}
  storage:
    
    provider: ${STORAGE_PROVIDER:local}
    local-dir: ${STORAGE_LOCAL_DIR:./var/media}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080/api/v1/media/local}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
