spring:
  application:
    name: carepoint
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/carepoint}
    username: ${DB_USER:carepoint}
    password: ${DB_PASSWORD:carepoint_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
    ignore-migration-patterns: repeatable:missing
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

server:
  port: 8080
  shutdown: graceful

carepoint:
  auth:
    jwt-issuer: carepoint
    # dev-only default — real deployments must set JWT_SIGNING_KEY (32+ random chars)
    jwt-signing-key: ${JWT_SIGNING_KEY:dev-only-insecure-key-change-me-32chars}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    access-cookie: cp_access
    refresh-cookie: cp_refresh
    # must be true in any https deployment; false only for local http dev
    cookie-secure: ${COOKIE_SECURE:false}
  rate-limit:
    login-per-minute: ${RATE_LIMIT_LOGIN_PER_MIN:5}
    register-per-minute: ${RATE_LIMIT_REGISTER_PER_MIN:5}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
